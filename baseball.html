<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숫자야구 · interns</title>
  <meta name="description" content="숨긴 숫자를 S·B 힌트로 맞히는 숫자야구.">
  <meta name="theme-color" content="#121212">
  <script>
    try { if (localStorage.getItem('interns-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2301539f'/%3E%3Cpath d='M7 15h18a9 9 0 0 1-18 0z' fill='white'/%3E%3Cpath d='M13 7c0 2 1.5 2 1.5 4M18 7c0 2 1.5 2 1.5 4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/hub.css">
  <script src="data/team.js" defer></script>
  <script src="js/hub-core.js" defer></script>
  <script src="js/baseball.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="shell">
    <aside class="side" id="side" aria-label="사이드바"></aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="main-col">
      <header class="top" id="top"></header>
      <main class="page" id="main" tabindex="-1">
        <a class="back" href="index.html"><span data-ic="back"></span>홈으로</a>
        <div class="page__head">
          <div>
            <h1 class="page__title">숫자야구</h1>
            <p class="page__sub">서로 다른 숫자 3·4자리를 맞혀요. 숫자와 자리가 맞으면 <b>S</b>(스트라이크), 숫자만 맞으면 <b>B</b>(볼), 하나도 없으면 <b>OUT</b>.</p>
          </div>
        </div>
        <div class="omok bball">
          <section class="card omok__main bmain" aria-label="숫자야구">
            <div class="bbar" id="bbar"></div>
            <div class="bboard" id="bboard"></div>
            <div class="binput" id="binput"></div>
            <div class="bmemo" id="bmemo"></div>
            <div class="otools" id="btools"></div>
            <p class="sr" id="blive" aria-live="polite"></p>
          </section>
          <div class="omok__side">
            <div class="seg omode" role="radiogroup" aria-label="대결 상대">
              <label><input type="radio" name="bmode" value="solo"><span>혼자</span></label>
              <label><input type="radio" name="bmode" value="pvp"><span>동기와</span><em class="pill pill--count" id="bpvpBadge" hidden></em></label>
            </div>
            <section class="card" id="soloPanel" aria-label="혼자 하기"></section>
            <div class="pvp" id="bpvpPanel" hidden></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
