<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>interns</title>
  <meta name="description" content="동기들끼리 쓰는 쪽지·일정·점심 뽑기 공간.">
  <meta name="theme-color" content="#121212">
  <script>
    try { if (localStorage.getItem('interns-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2301539f'/%3E%3Cpath d='M7 15h18a9 9 0 0 1-18 0z' fill='white'/%3E%3Cpath d='M13 7c0 2 1.5 2 1.5 4M18 7c0 2 1.5 2 1.5 4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/hub.css">
  <script src="data/team.js" defer></script>
  <script src="js/hub-core.js" defer></script>
  <script src="js/home.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="shell">
    <aside class="side" id="side" aria-label="사이드바"></aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="main-col">
      <header class="top" id="top"></header>
      <main class="page" id="main" tabindex="-1">
        <div class="bento" id="bento">

          <section class="card welcome c-8" aria-labelledby="hello">
            <div>
              <p class="welcome__date" id="today"></p>
              <h1 id="hello"></h1>
              <p id="helloSub"></p>
            </div>
            <div class="stats" id="stats"></div>
          </section>

          <section class="card c-4 r-2" aria-labelledby="wkTitle">
            <div class="card__head">
              <h2 class="card__title" id="wkTitle"><span data-ic="calendar"></span>이번 주 일정</h2>
              <a class="card__more" href="schedule.html">달력<span data-ic="arrow"></span></a>
            </div>
            <ul class="agenda" id="week" aria-live="polite"></ul>
            <div class="card__foot">
              <button class="btn btn--accent btn--sm" type="button" id="schedBtn"><span data-ic="plus"></span>일정 올리기</button>
            </div>
          </section>

          <section class="card feature lunchcard c-8" id="lunchCard" aria-labelledby="lcTitle"></section>

          <section class="card c-4" id="notices" aria-labelledby="ntTitle" tabindex="-1">
            <div class="card__head"><h2 class="card__title" id="ntTitle"><span data-ic="megaphone"></span>공지사항</h2><a class="card__more" href="notices.html">전체 보기<span data-ic="arrow"></span></a></div>
            <ul class="list" id="noticeList" aria-live="polite"></ul>
            <div class="card__foot">
              <button class="btn btn--ghost btn--sm" type="button" id="noticeWrite"><span data-ic="edit"></span>공지 쓰기</button>
            </div>
          </section>

          <section class="card c-4" aria-labelledby="acTitle">
            <div class="card__head"><h2 class="card__title" id="acTitle"><span data-ic="pulse"></span>최근 활동</h2></div>
            <ul class="list" id="activityList"></ul>
          </section>

          <section class="card c-4" id="team" aria-labelledby="tmTitle" tabindex="-1">
            <div class="card__head"><h2 class="card__title" id="tmTitle"><span data-ic="users"></span>멤버</h2><span class="muted" style="font-size:13px" id="onlineCount"></span></div>
            <ul class="list" id="teamList" aria-live="polite"></ul>
            <div class="card__foot">
              <a class="btn btn--accent btn--sm" href="messages.html?to=group"><span data-ic="group"></span>단체방</a>
              <button class="btn btn--ghost btn--sm" type="button" id="inviteBtn"><span data-ic="userPlus"></span>초대하기</button>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>
</body>
</html>
