<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오목 · interns</title>
  <meta name="description" content="컴퓨터나 동기와 오목을 둬요.">
  <meta name="theme-color" content="#121212">
  <script>
    try { if (localStorage.getItem('interns-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2301539f'/%3E%3Cpath d='M7 15h18a9 9 0 0 1-18 0z' fill='white'/%3E%3Cpath d='M13 7c0 2 1.5 2 1.5 4M18 7c0 2 1.5 2 1.5 4' stroke='white' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/hub.css">
  <script src="data/team.js" defer></script>
  <script src="js/hub-core.js" defer></script>
  <script src="js/omok.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 건너뛰기</a>
  <div class="shell">
    <aside class="side" id="side" aria-label="사이드바"></aside>
    <div class="scrim" id="scrim" aria-hidden="true"></div>
    <div class="main-col">
      <header class="top" id="top"></header>
      <main class="page" id="main" tabindex="-1">
        <a class="back" href="index.html"><span data-ic="back"></span>홈으로</a>
        <div class="page__head">
          <div>
            <h1 class="page__title">오목</h1>
            <p class="page__sub">흑이 먼저 둬요. 다섯 개 이상 이으면 이기고, 흑은 33(열린 3 두 개를 한 번에)이 금지예요.</p>
          </div>
        </div>
        <div class="omok">
          <section class="card omok__main" aria-label="오목판">
            <div class="obar" id="obar"></div>
            <div class="goban-wrap">
              <div class="goban" id="goban" role="group" aria-label="오목판 15×15 · 방향키로 움직이고 Enter로 둬요"></div>
              <div class="oover" id="oover" hidden></div>
            </div>
            <div class="otools" id="otools"></div>
            <p class="sr" id="olive" aria-live="polite"></p>
          </section>
          <div class="omok__side">
            <div class="seg omode" role="radiogroup" aria-label="대국 상대">
              <label><input type="radio" name="omode" value="ai"><span>컴퓨터와</span></label>
              <label><input type="radio" name="omode" value="pvp"><span>동기와</span><em class="pill pill--count" id="pvpBadge" hidden></em></label>
            </div>
            <section class="card" id="aiPanel" aria-label="컴퓨터와 두기"></section>
            <div class="pvp" id="pvpPanel" hidden></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
