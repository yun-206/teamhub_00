<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입장하기 · 팀 허브</title>
  <meta name="description" content="초대 링크로 팀 허브에 들어오는 화면(시연용 데모).">
  <meta name="theme-color" content="#121212">
  <script>
    try { if (localStorage.getItem('tourdata-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2301539f'/%3E%3Cpath d='M9 22V10m7 12V14m7 8v-5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/hub.css">
  <script src="data/tools.js" defer></script>
  <script src="data/team.js" defer></script>
  <script src="js/hub-core.js" defer></script>
  <script src="js/join.js" defer></script>
</head>
<body class="join-body">
  <main class="join" id="main">
    <div class="join__brand">
      <span class="brand__logo" aria-hidden="true" id="jLogo"></span>
      <span class="brand__txt"><b id="jTeam">Team</b><small id="jSub"></small></span>
    </div>

    <section class="card join__card" aria-labelledby="jTitle">
      <ol class="steps" aria-label="입장 단계">
        <li class="is-on" id="s1Dot"><span>1</span>비밀번호</li>
        <li id="s2Dot"><span>2</span>내 정보</li>
      </ol>

      <!-- 1단계: 비밀번호 -->
      <form id="pwForm" novalidate>
        <h1 class="join__title" id="jTitle">팀 허브에 들어가기</h1>
        <p class="join__sub" id="jIntro">초대받은 링크예요. 전달받은 비밀번호를 입력해 주세요.</p>
        <label class="fld">
          <span>비밀번호</span>
          <input type="password" id="fPw" autocomplete="off" required>
          <small class="fld__err" id="ePw"></small>
        </label>
        <button class="btn btn--accent join__go" type="submit">다음</button>
      </form>

      <!-- 2단계: 이름·직급 -->
      <form id="infoForm" novalidate hidden>
        <h1 class="join__title" tabindex="-1" id="jTitle2">내 정보 입력</h1>
        <p class="join__sub">팀원들에게 이 이름과 직급으로 보여요.</p>
        <label class="fld">
          <span>이름 <em>*</em></span>
          <input type="text" id="fName" maxlength="12" placeholder="예: 홍길동" autocomplete="name" required>
          <small class="fld__err" id="eName"></small>
        </label>
        <label class="fld">
          <span>직급 <em>*</em></span>
          <select id="fRole" required></select>
          <small class="fld__err" id="eRole"></small>
        </label>
        <div class="fld">
          <span>소속팀</span>
          <p class="fixed" id="fTeam"></p>
        </div>
        <p class="hint" id="returning" hidden></p>
        <div class="join__row">
          <button class="btn btn--ghost" type="button" id="backPw">이전</button>
          <button class="btn btn--accent join__go" type="submit" id="enterBtn">입장하기</button>
        </div>
      </form>
    </section>

    <p class="join__note" id="jNote" aria-live="polite"></p>
  </main>
</body>
</html>
